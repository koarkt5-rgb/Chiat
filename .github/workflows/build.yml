name: Build Cheat SO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Покажем в логах, что вообще загружено в репозиторий
      - name: List files
        run: ls -la

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      # Умная сборка: ищет CMakeLists.txt где угодно
      - name: Build with CMake
        run: |
          CMAKE_FILE=$(find . -name "CMakeLists.txt" | head -n 1)
          if [ -z "$CMAKE_FILE" ]; then
            echo "ОШИБКА: Файл CMakeLists.txt не найден в репозитории!"
            exit 1
          fi
          CMAKE_DIR=$(dirname "$CMAKE_FILE")
          echo "Найдена папка для сборки: $CMAKE_DIR"
          cd "$CMAKE_DIR"
          cmake -B build -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 .
          cmake --build build --config Release

      # Собираем все полученные .so файлы
      - name: Upload SO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cheat-SO-File
          path: '**/*.so'
